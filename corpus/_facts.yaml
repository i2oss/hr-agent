# Ridgeline Structural Engineering: Company Facts sheet
#
# FICTIONAL. For demonstration only. Not HR or legal advice.
#
# The single source of every number, name, date, approver and threshold in the
# Policy Corpus, the Mock Data and the Compliance Check. Policy prose is written
# FROM this file (build slice 1); a consistency script checks every number in
# the corpus against it, and the data test checks mock_data/ against it.
#
# Conventions
# - `cite:` is where the fact is written: "<doc_id> §<section>" (see corpus/_outlines.md).
# - Days are working days (Mon–Fri, excluding the employee's company holidays)
#   unless the key says calendar_days.
# - Money is USD unless stated.
# - The policies state COMPANY rules only. They make no claims about real law;
#   tax, immigration and legal questions route to HR (Cross-Border Review / Escalation).

meta:
  company: Ridgeline Structural Engineering, Inc.
  short_name: Ridgeline
  industry: civil and structural engineering consultancy
  headcount: 450
  banner: "FICTIONAL — for demonstration only"
  demo_today: 2026-11-02          # Monday; DEMO_TODAY default; all "as of" dates use it
  email_domain: ridgeline.example
  policy_year: 2026
  version: "2026.1"
  effective: 2026-01-01           # every document unless overridden below

offices:
  - {id: DEN, city: Denver,  region: CO, country: US, timezone: America/Denver,      role: headquarters, holiday_calendar: US}
  - {id: AUS, city: Austin,  region: TX, country: US, timezone: America/Chicago,     holiday_calendar: US}
  - {id: SEA, city: Seattle, region: WA, country: US, timezone: America/Los_Angeles, holiday_calendar: US}
  - {id: TOR, city: Toronto, region: ON, country: CA, timezone: America/Toronto,     holiday_calendar: CA}
offices_cite: RSE-HB-01 §2.1

employment_types:              # cite: RSE-HB-01 §2.2
  full_time_exempt:     {label: "Full-time, exempt",     weekly_hours: 40, hr_policies_apply: true}
  full_time_non_exempt: {label: "Full-time, non-exempt (hourly)", weekly_hours: 40, hr_policies_apply: true, overtime_preapproval: true}
  part_time:            {label: "Part-time", weekly_hours_min: 20, weekly_hours_max: 29, hr_policies_apply: true}
  intern:               {label: "Intern", max_months: 6, hr_policies_apply: true}
  contractor:
    label: "Contractor"
    hr_policies_apply: false   # governed by their contract / agency
    policies_that_do_apply: [RSE-HB-01 §4, RSE-HB-01 §5, RSE-HB-01 §6, RSE-SEC-01]
    redirect: "your agency or Ridgeline contract manager"
employment_types_cite: RSE-HB-01 §2.2
contractor_scope_cite: RSE-HB-01 §1.2

work_arrangements:             # cite: RSE-HB-01 §2.3, detail in RSE-RW-01 §2
  office_hybrid:
    label: Office-hybrid
    default: true
    anchor_days_per_week: 3
    anchor_days: [Tue, Wed, Thu]
    cite: RSE-RW-01 §2.1
  remote_approved:
    label: Remote-approved
    approvers: [manager, HR]
    office_visits: "at least one week per quarter at the home office"
    cite: RSE-RW-01 §2.2
  field_site:
    label: Field/site-based
    remote_eligible: false
    temporary_remote_eligible: false
    cite: RSE-RW-01 §2.3

hours:                         # RSE-HB-01 §3
  standard_week_hours: 40                          # §3.1
  core_hours_local: "10:00–15:00"                  # §3.2 (also RSE-RW-01 §5.1)
  non_exempt_overtime: "pre-approved in writing by the manager"   # §3.3
  part_time_schedule: "agreed in writing with the manager"        # §3.4
  cite: RSE-HB-01 §3

conduct:                       # RSE-HB-01 §4–§6
  gifts_declare_over: 100
  gifts_cite: RSE-HB-01 §4.3
  safety_incident_report_hours: 24
  safety_cite: RSE-HB-01 §5.2
  hr_acknowledges_working_days: 2
  next_steps_cite: RSE-HB-01 §6.4
  access_rule: "self: all own records; managers/directors: reporting chain's profile and PTO balance only; benefits and HR tickets: self and HR only"
  access_rule_cite: RSE-HB-01 §7.2

# Named roles. Personas and their managers live in mock_data/employees.json;
# these are the corpus-level owners and contacts.
people:
  hr_director:       {name: Renata Alvarez, title: Director of People & HR, cite: RSE-APR-01 §6}
  vp_finance:        {name: Tom Whitaker,   title: VP Finance,               cite: RSE-APR-01 §4}
  security_lead:     {name: Ines Moreau,    title: Head of Information Security, cite: RSE-SEC-01 §1.2}
  # Demo reporting chain (mock data must match):
  demo_chain:
    E1001: {manager: E1012, director: E1009}       # Maya Chen -> Jordan Lee -> Marcus Reed
    E1012: {name: Jordan Lee, title: Engineering Manager, office: DEN}

contacts:                      # every "contact HR" pointer resolves here
  hr_service_desk:  {email: hr@ridgeline.example,       portal: "HR Portal > Ask HR", response: "2 working days", cite: RSE-HB-01 §6.1}
  hr_confidential:  {queue: HR Confidential, email: hr-confidential@ridgeline.example, ethics_line: "+1 555 0100 (24/7, anonymous option)", cite: RSE-HB-01 §6.1}
  it_security:      {email: security@ridgeline.example, phone: "+1 555 0142 (24/7)", cite: RSE-SEC-01 §7.1}
  travel_desk:      {portal: "Ridgeline Travel (internal booking portal)", cite: RSE-EXP-01 §2.2}
  finance_ap:       {email: expenses@ridgeline.example, cite: RSE-EXP-01 §8}

documents:
  - {id: RSE-HB-01,  title: "Employee Handbook & Code of Conduct",                 pages: 8, format: pdf,  owner: HR,      applies_to: "all staff; contractors §4–§6 only"}
  - {id: RSE-PTO-01, title: "Paid Time Off Policy",                                pages: 5, format: md,   owner: HR,      applies_to: "full-time, part-time, interns"}
  - {id: RSE-HOL-01, title: "Holiday Calendar & Observance",                       pages: 2, format: html, owner: HR,      applies_to: "full-time, part-time, interns; US and Canada calendars"}
  - {id: RSE-LV-01,  title: "Leave of Absence Policy",                             pages: 6, format: md,   owner: HR,      applies_to: "full-time, part-time; interns §2, §4, §5 only"}
  - {id: RSE-RW-01,  title: "Remote & Hybrid Work Policy",                         pages: 5, format: md,   owner: HR,      applies_to: "full-time, part-time, interns"}
  - {id: RSE-LOC-01, title: "Work Location, Travel & Cross-Border Work Guidelines", pages: 4, format: md,   owner: HR,      applies_to: "all employees"}
  - {id: RSE-SEC-01, title: "Information Security & Acceptable Use",               pages: 6, format: md,   owner: IT,      applies_to: "everyone with Ridgeline access, including contractors"}
  - {id: RSE-EXP-01, title: "Travel & Expense Reimbursement",                      pages: 5, format: pdf,  owner: Finance, applies_to: "all employees"}
  - {id: RSE-BEN-01, title: "Benefits Summary & Eligibility",                      pages: 6, format: html, owner: HR,      applies_to: "US plans §2; Canada §5"}
  - {id: RSE-EQ-01,  title: "Equipment & Home-Office Stipend",                     pages: 3, format: md,   owner: IT,      applies_to: "full-time, part-time; interns §1, §4 only"}
  - {id: RSE-ONB-01, title: "Onboarding Procedures",                               pages: 3, format: md,   owner: HR,      applies_to: "new employees and their managers"}
  - {id: RSE-APR-01, title: "Approval Matrix",                                     pages: 2, format: md,   owner: HR,      applies_to: "all employees and approvers"}

# ---------------------------------------------------------------- PTO (RSE-PTO-01)
pto:
  eligibility:
    eligible: [full_time_exempt, full_time_non_exempt, part_time, intern]
    not_eligible: [contractor]
    cite: RSE-PTO-01 §1.2
  accrual:
    full_time_days_per_year:          # by completed years of service on Jan 1 (or hire date)
      - {years_from: 0, years_to: 2, days: 15}
      - {years_from: 3, years_to: 5, days: 20}
      - {years_from: 6, years_to: null, days: 25}
    full_time_cite: RSE-PTO-01 §2.1
    part_time_rule: "full-time days × (scheduled weekly hours ÷ 40), rounded to the nearest half day"
    part_time_example: {weekly_hours: 24, tenure_band_days: 15, days: 9}
    part_time_cite: RSE-PTO-01 §2.2
    intern_days_per_internship: 5
    intern_cite: RSE-PTO-01 §2.3
    timing: "accrues each semi-monthly pay period (24 per year); annual days ÷ 24 per period"
    timing_cite: RSE-PTO-01 §2.4
    during_leave: "accrues during paid leave; does not accrue during unpaid leave"
    during_leave_cite: RSE-PTO-01 §2.5
  use:
    minimum_increment_days: 0.5
    increment_cite: RSE-PTO-01 §3.1
    company_holidays_not_deducted: true          # holiday inside a PTO range is not charged
    holidays_cite: RSE-PTO-01 §3.2               # cross-ref RSE-HOL-01 §1.3
    negative_balance_allowed: false
    insufficient_balance: "request unpaid personal leave (RSE-LV-01 §6) or reduce the request"
    balance_cite: RSE-PTO-01 §3.3
    balance_where: "HR Portal > Time Off (balance shown as of the last pay period)"
    balance_where_cite: RSE-PTO-01 §3.4
  requesting:
    how: "submit in the HR Portal before the first day off"
    how_cite: RSE-PTO-01 §4.1
    notice_threshold_days: 3                     # requests of MORE than 3 PTO days...
    notice_required_calendar_days: 14            # ...need 2 weeks' notice
    short_request_notice: "as early as practical; no minimum"
    notice_cite: RSE-PTO-01 §4.2
    default_approver: manager
    director_threshold_consecutive_days: 10      # MORE than 10 consecutive PTO days -> director
    approvers_cite: RSE-PTO-01 §4.3
    field_blackout:
      applies_to: field_site
      window: {from: "12-18", to: "12-31"}       # last 2 weeks of December; 2026: Fri Dec 18 – Thu Dec 31
      exception_approver: director
      cite: RSE-PTO-01 §4.4
    changes: "cancel or change in the HR Portal; approved PTO cancelled before it starts is restored"
    changes_cite: RSE-PTO-01 §4.5
  carryover:
    cap_days: 5
    cap_cite: RSE-PTO-01 §5.1
    forfeit_on: "Dec 31: unused days above the cap are forfeited"
    leave_exception_cap_days: 10                 # on approved leave spanning Dec 31
    leave_exception_cite: RSE-PTO-01 §5.2
    payout_on_exit: "handled by HR at separation"
    payout_cite: RSE-PTO-01 §5.3
  questions_cite: RSE-PTO-01 §6

