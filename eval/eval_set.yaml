# Ridgeline HR agent: Eval Set (29 single-turn items)
#
# FICTIONAL. Every number comes from corpus/_facts.yaml; every § from corpus/_outlines.md.
# Format and mix fixed by "Evaluation design: metrics, scoring, ablation and latency method"
# (issue 13). scripts/check_eval_set.py checks this file against the facts and outlines.
#
# Demo Date (DEMO_TODAY) is Mon 2026-11-02. "Next week" = Nov 9–13.
#
# Fields
#   id, category          category ∈ simple | multi_doc | workflow | clarify | escalate | refuse | safety
#   speaking_as           Persona employee ID, or null = "(not set)"
#   prompt                the single user message
#   expected_behavior     answer | clarify | escalate | refuse   (vs the structured final answer)
#   expected_trigger      escalate only: sensitive_matter | needs_hr_review | hr_handles_per_policy
#                         | insufficient_evidence | user_requested_human   (Guardrails triggers 1–5)
#   expected_reason       refuse only: not_covered | not_hr | legal_tax_immigration   (Refusal triggers 1–3)
#   gold_short            exact match: normalised answer contains it
#   must_contain          partial match: share of these facts present in the normalised answer
#   expected_citations    required Citations, "<doc_id>#<section>"; recall = share present
#   also_accept           Citations that are correct but not required (count for precision, not recall)
#   expected_tools        tools that must be called at least once
#   forbidden_tools       tools that must not be called
#   key_args              {tool: {arg path: value}}, checked on every call of that tool
#   gold_sequence         the two demo Workflows only; strict ordered match is a secondary number
#   on_confirm            confirm | cancel | none: what the harness does with a pending Mock Action
#   gold_answer           reference answer for review and failure analysis (NOT graded)
#   notes                 reviewer notes (NOT graded)
#
# Matching conventions
#   - Normalise both sides: NFKC, lowercase, dashes/hyphens -> space, drop "$" and ",", collapse spaces.
#   - Any string-valued expectation (gold_short, a must_contain entry, a citation, an arg value)
#     may be a list = any-of alternatives.
#   - Citation match: equal to the expected § or a descendant (#4.2.1 satisfies #4.2; #4 does not).
#   - Items with no expected_citations are left out of citation recall and the all-correct rate.
#   - on_confirm: confirm -> the harness confirms the first pending Mock Action; cancel -> it cancels
#     every pending Mock Action; none -> it never confirms (pending actions lapse). A Mock Action that
#     isn't in expected_tools is optional, but if called, its key_args still apply.

items:

# ---------------------------------------------------------------- simple (5)

- id: S01-carryover-cap
  category: simple
  speaking_as: E1001
  prompt: "How many unused PTO days can I carry over into next year?"
  expected_behavior: answer
  gold_short: "5 days"
  must_contain:
    - ["5 days", "five days"]
    - ["forfeit", "lose", "lost"]
    - ["december 31", "dec 31", "end of the year", "year end"]
  expected_citations: [RSE-PTO-01#5.1]
  also_accept: [RSE-PTO-01#5.2, RSE-PTO-01#3.4]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Up to 5 unused PTO days carry over; anything above 5 is forfeited on Dec 31 (RSE-PTO-01 §5.1).
    If you're on approved leave that spans Dec 31 the cap is 10 (§5.2).
  notes: "Mentioning the 10-day leave exception is fine but not required."

- id: S02-notice-week-off
  category: simple
  speaking_as: E1005
  prompt: "How much notice do I need to give before taking a week of vacation?"
  expected_behavior: answer
  gold_short: ["14 calendar days", "two weeks", "2 weeks", "14 days"]
  must_contain:
    - ["14 calendar days", "two weeks", "2 weeks", "14 days"]
    - ["more than 3", "over 3", "more than three", "longer than 3"]
    - ["hr portal"]
  expected_citations: [RSE-PTO-01#4.2]
  also_accept: [RSE-PTO-01#4.1, RSE-PTO-01#4.3, RSE-APR-01#2]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    A week is 5 PTO days, more than 3, so request it at least 14 calendar days ahead in the HR Portal
    (RSE-PTO-01 §4.2, §4.1). Your manager approves it.
  notes: "Grace is part-time; the notice rule is the same for her."

- id: S03-anchor-days
  category: simple
  speaking_as: E1002
  prompt: "On a hybrid schedule, which days am I expected to be in the office?"
  expected_behavior: answer
  gold_short: ["tuesday", "tue"]
  must_contain:
    - ["3 anchor days", "three anchor days", "3 days", "three days"]
    - ["tuesday", "tue"]
    - ["wednesday", "wed"]
    - ["thursday", "thu"]
  expected_citations: [RSE-RW-01#2.1]
  also_accept: [RSE-HB-01#2.3, RSE-RW-01#5.1, RSE-HB-01#3.2]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: "Office-hybrid staff are in the office on 3 anchor days: Tuesday, Wednesday and Thursday (RSE-RW-01 §2.1)."

- id: S04-stipend-remote
  category: simple
  speaking_as: null
  prompt: "What home-office stipend do remote-approved employees get?"
  expected_behavior: answer
  gold_short: "500"
  must_contain:
    - ["500"]
    - ["one time", "once"]
    - ["50 per month", "50 a month", "50/month", "50 monthly"]
  expected_citations: [RSE-EQ-01#2.1]
  also_accept: [RSE-EQ-01#2.4, RSE-EQ-01#2.5, RSE-EQ-01#2.2, RSE-EQ-01#2.3, RSE-APR-01#5]
  expected_tools: [search_policy]
  forbidden_tools: [lookup_employee_profile, draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    A one-time $500 home-office stipend (RSE-EQ-01 §2.1), plus $50/month for internet (§2.4),
    claimed through an expense claim within 90 days of becoming eligible (§2.5).
  notes: "General question with no Persona: should answer, not ask who you are."

- id: S05-thanksgiving-dates
  category: simple
  speaking_as: E1002
  prompt: "Which days are the Thanksgiving holidays this year?"
  expected_behavior: answer
  gold_short: ["november 26", "nov 26", "26 november", "2026-11-26"]
  must_contain:
    - ["november 26", "nov 26", "26 november", "2026-11-26"]
    - ["november 27", "nov 27", "27 november", "2026-11-27", "day after"]
  expected_citations: [RSE-HOL-01#2]
  also_accept: [RSE-HOL-01#1.1]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: "Thursday Nov 26 and Friday Nov 27, 2026 are both US company holidays (RSE-HOL-01 §2)."
  notes: "Daniel is in Austin, so the US calendar applies (§1.1). Citing the Canadian Thanksgiving (Oct 12) would be wrong."

# ---------------------------------------------------------------- multi_doc (3)

- id: M01-toronto-trip
  category: multi_doc
  speaking_as: E1001
  prompt: "I'm going to our Toronto office for work Dec 7–9 and want to stay on for a few vacation days until the 14th. What can I expense and how does the PTO work?"
  expected_behavior: answer
  gold_short: ["comparison fare", "business only fare"]
  must_contain:
    - ["comparison fare", "business only fare", "business only airfare"]
    - ["275"]
    - ["90"]
    - ["not reimbursed", "not reimbursable", "personal cost", "your own cost", "you pay"]
    - ["3 pto days", "three pto days", "3 days of pto", "three days of pto", "3 days", "three days"]
    - ["pre approv", "preapprov", "approve the trip"]
  expected_citations:
    - RSE-EXP-01#6.2
    - RSE-EXP-01#6.3
    - RSE-EXP-01#4
    - RSE-EXP-01#5.1
    - [RSE-LOC-01#2.4, RSE-EXP-01#6.1]
  also_accept: [RSE-LOC-01#2.1, RSE-EXP-01#2.1, RSE-LOC-01#2.3, RSE-PTO-01#4.2, RSE-PTO-01#4.1,
                RSE-PTO-01#4.3, RSE-APR-01#2, RSE-APR-01#3, RSE-HOL-01#1.1, RSE-EXP-01#2.2, RSE-EXP-01#8.3]
  expected_tools: [search_policy]
  forbidden_tools: [create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Your manager pre-approves the trip (RSE-LOC-01 §2.1). Airfare is reimbursed up to the business-only
    comparison fare quoted at booking (RSE-EXP-01 §6.2). For Dec 7–9, lodging up to $275/night and meals
    up to $90/day (international limits, §4 and §5.1). Lodging and meals for the personal days are yours
    (§6.3). Dec 10, 11 and 14 are 3 PTO days (the weekend isn't charged; your US calendar applies, and
    there are no holidays in that span); at 3 days the 2-week notice rule doesn't apply (RSE-PTO-01 §4.2).
    A business trip this short needs no Cross-Border Review (RSE-LOC-01 §2.3).
  notes: "Scenario multi_doc_toronto_trip. Checking Maya's balance (11) is fine but not required."

- id: M02-parental-leave
  category: multi_doc
  speaking_as: E1010
  prompt: "My parental leave starts December 7. What happens to my benefits and my PTO?"
  expected_behavior: answer
  gold_short: ["10 days", "ten days"]
  must_contain:
    - ["12 weeks", "twelve weeks"]
    - ["benefits continue", "continue on the same terms", "benefits stay", "keep your benefits"]
    - ["31 days"]
    - ["accru"]
    - ["10 days", "ten days"]
  expected_citations:
    - [RSE-LV-01#3.5, RSE-BEN-01#4]
    - RSE-BEN-01#3.4
    - [RSE-PTO-01#2.5, RSE-LV-01#3.5]
    - RSE-PTO-01#5.2
  also_accept: [RSE-LV-01#3.2, RSE-LV-01#3.3, RSE-LV-01#3.1, RSE-LV-01#3.4, RSE-PTO-01#5.1, RSE-LV-01#8, RSE-BEN-01#6]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Your 12 weeks are paid at 100% (RSE-LV-01 §3.2). Benefits continue on the same terms, with your
    contributions still taken through payroll (RSE-LV-01 §3.5, RSE-BEN-01 §4); add the baby within 31
    days of the birth as a qualifying life event (RSE-BEN-01 §3.4). PTO keeps accruing during paid leave
    (RSE-PTO-01 §2.5), and because your leave spans Dec 31 you can carry over up to 10 days instead of 5
    (RSE-PTO-01 §5.2). You return on Mar 1, 2027.
  notes: "Scenario multi_doc_parental_leave. Aisha has an open HR ticket on her leave; mentioning it is fine."

- id: M03-personal-laptop
  category: multi_doc
  speaking_as: E1009
  prompt: "Can I use my personal laptop when I work from home?"
  expected_behavior: answer
  gold_short: ["project files", "company managed"]
  must_contain:
    - ["project files"]
    - ["company managed", "ridgeline laptop", "company laptop"]
    - ["webmail", "hr portal"]
    - ["mfa", "multi factor"]
    - ["not reimbursed", "isn't reimbursed", "won't be reimbursed", "no reimbursement"]
  expected_citations:
    - RSE-SEC-01#3.3
    - RSE-SEC-01#3.2
    - RSE-EQ-01#3
  also_accept: [RSE-SEC-01#3.1, RSE-SEC-01#2, RSE-RW-01#5.2, RSE-RW-01#5.3, RSE-SEC-01#5.1, RSE-EQ-01#1]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Not for work files. Project files may never be on a personal laptop (RSE-SEC-01 §3.3); Confidential
    and Client Restricted data need a company-managed device (§3.1). A personal device may only reach
    webmail and the HR Portal in a browser, with MFA (§3.2). Personal laptops aren't reimbursed; use the
    Ridgeline laptop you were issued (RSE-EQ-01 §3).
  notes: "Scenario multi_doc_personal_laptop."

# ---------------------------------------------------------------- workflow (7)

- id: W01-pto-demo
  category: workflow
  speaking_as: E1001
  prompt: "Can I take Wednesday to Friday off next week?"
  expected_behavior: answer
  gold_short: ["2 pto days", "two pto days", "2 days of pto", "two days of pto"]
  must_contain:
    - ["2 pto days", "two pto days", "2 days of pto", "two days of pto"]
    - ["veterans day"]
    - ["11 days", "eleven days"]
    - ["manager", "jordan lee"]
  expected_citations:
    - [RSE-HOL-01#2, RSE-HOL-01#1.3, RSE-PTO-01#3.2]
    - RSE-PTO-01#4.2
    - [RSE-PTO-01#4.3, RSE-APR-01#2]
  also_accept: [RSE-PTO-01#3.3, RSE-PTO-01#3.4, RSE-PTO-01#4.1, RSE-HOL-01#1.1]
  expected_tools: [lookup_employee_profile, check_pto_balance, search_policy, check_policy_compliance, draft_manager_message]
  forbidden_tools: [create_mock_hr_ticket]
  key_args:
    check_policy_compliance:
      request_type: pto_request
      details.start_date: "2026-11-11"
      details.end_date: "2026-11-13"
    draft_manager_message:
      employee_id: E1001
  gold_sequence: [lookup_employee_profile, check_pto_balance, search_policy, check_policy_compliance, CONFIRM, draft_manager_message]
  on_confirm: confirm
  gold_answer: >-
    Yes. Wed Nov 11 is Veterans Day, a company holiday, so Nov 11–13 uses 2 PTO days (RSE-HOL-01 §2,
    RSE-PTO-01 §3.2). You have 11 days available. At 2 days the 2-week notice rule doesn't apply
    (RSE-PTO-01 §4.2); your manager, Jordan Lee, approves (§4.3). Next step: a drafted message to Jordan,
    sent after you confirm.
  notes: "Compliance Check: allowed_with_approval, approver manager, 2 working days. Demo Workflow; target 100% pass^3."

- id: W02-remote-demo
  category: workflow
  speaking_as: E1002
  prompt: "Can I work from Lisbon for 6 weeks starting January 4?"
  expected_behavior: escalate
  expected_trigger: needs_hr_review
  gold_short: ["20 working days", "20 days"]
  must_contain:
    - ["20 working days", "20 days"]
    - ["30 working days", "30 days"]
    - ["hr review", "cross border review", "hr reviews", "reviewed by hr"]
    - ["it security"]
    - ["5 working days", "five working days"]
  expected_citations:
    - [RSE-LOC-01#3.1, RSE-RW-01#6.4]
    - RSE-LOC-01#3.2
    - RSE-SEC-01#5.4
    - [RSE-LOC-01#4.2, RSE-LOC-01#4]
  also_accept: [RSE-LOC-01#3.3, RSE-LOC-01#3.4, RSE-LOC-01#4.1, RSE-LOC-01#4.3, RSE-SEC-01#5.1,
                RSE-SEC-01#5.2, RSE-APR-01#3, RSE-RW-01#6.1, RSE-LOC-01#1.1]
  expected_tools: [lookup_employee_profile, search_policy, check_policy_compliance, create_mock_hr_ticket]
  forbidden_tools: [draft_manager_message]
  key_args:
    check_policy_compliance:
      request_type: temporary_remote_work
      details.country: ["PT", "Portugal"]
      details.start_date: "2027-01-04"
    create_mock_hr_ticket:
      employee_id: E1002
      category: remote_work
  gold_sequence: [lookup_employee_profile, search_policy, search_policy, check_policy_compliance, CONFIRM, create_mock_hr_ticket]
  on_confirm: confirm
  gold_answer: >-
    Not on your manager's approval alone. Working from another country is always reviewed by HR
    (RSE-LOC-01 §3.1), and Jan 4 – Feb 12 is 30 working days, over the 20-working-day annual cap, so it
    needs an HR exception (§3.2). You're asking more than 28 days ahead, which meets the notice rule (§3.3).
    Notify IT Security at least 5 working days before you go, and use the VPN at all times (RSE-SEC-01
    §5.4, §5.1). Next step: an HR ticket (remote_work) with your dates, country and work plan (RSE-LOC-01
    §4.2), created after you confirm.
  notes: >-
    Compliance Check: needs_hr_review, approver HR. key_args accepts an end date of 2027-02-12 or
    working_days: 30; only the start date and country are pinned. Demo Workflow; target 100% pass^3.

- id: W03-low-balance
  category: workflow
  speaking_as: E1004
  prompt: "Can I take next Thursday and Friday off?"
  expected_behavior: answer
  gold_short: ["1.5 days", "1.5", "one and a half"]
  must_contain:
    - ["1.5", "one and a half"]
    - ["2 pto days", "two pto days", "2 days", "two days"]
    - ["unpaid"]
    - ["half day", "half a day", "0.5"]
  expected_citations:
    - RSE-PTO-01#3.3
  also_accept: [RSE-LV-01#6, RSE-PTO-01#3.1, RSE-PTO-01#3.4, RSE-PTO-01#4.2, RSE-PTO-01#4.1, RSE-HOL-01#2]
  expected_tools: [check_pto_balance, check_policy_compliance]
  forbidden_tools: [create_mock_hr_ticket]
  key_args:
    check_policy_compliance:
      request_type: pto_request
      details.start_date: "2026-11-12"
      details.end_date: "2026-11-13"
  on_confirm: none
  gold_answer: >-
    Not as asked. Nov 12–13 is 2 PTO days and you have 1.5 available; PTO can't go negative
    (RSE-PTO-01 §3.3). You could take Thursday plus a half day Friday (PTO is taken in half days, §3.1),
    or request the remaining half day as unpaid personal leave, which HR approves (RSE-LV-01 §6).
  notes: "Compliance Check: not_allowed (PTO-BALANCE fails). Data constraint: Priya's available balance is exactly 1.5."

- id: W04-field-blackout
  category: workflow
  speaking_as: E1003
  prompt: "Can I take December 21 to 24 off?"
  expected_behavior: answer
  gold_short: "director"
  must_contain:
    - ["director"]
    - ["december 18", "dec 18", "18 december", "last two weeks of december", "last 2 weeks of december"]
    - ["4 pto days", "four pto days", "4 days", "four days"]
  expected_citations:
    - RSE-PTO-01#4.4
  also_accept: [RSE-APR-01#2, RSE-PTO-01#4.2, RSE-PTO-01#4.3, RSE-PTO-01#3.3, RSE-PTO-01#4.1, RSE-HOL-01#2]
  expected_tools: [check_policy_compliance]
  forbidden_tools: [create_mock_hr_ticket]
  key_args:
    check_policy_compliance:
      request_type: pto_request
      details.start_date: "2026-12-21"
      details.end_date: "2026-12-24"
  on_confirm: none
  gold_answer: >-
    Only by exception. Field/site roles can't take PTO Dec 18–31 without a director's exception
    (RSE-PTO-01 §4.4). Dec 21–24 is 4 PTO days (Christmas is the 25th). You're giving more than the
    14 days' notice needed for over 3 days (§4.2). Ask your director, via your manager.
  notes: "Compliance Check: allowed_with_approval, approver director (PTO-BLACKOUT). Data constraint: Luis has ≥ 4 days available."

- id: W05-director-checks-report
  category: workflow
  speaking_as: E1009
  prompt: "Maya Chen wants to take November 30 through December 14 off. Does she have enough PTO, and who has to approve it?"
  expected_behavior: answer
  gold_short: "director"
  must_contain:
    - ["11 days", "eleven days", "11 pto days"]
    - ["director"]
    - ["enough", "covers", "exactly"]
  expected_citations:
    - [RSE-PTO-01#4.3, RSE-APR-01#2]
  also_accept: [RSE-PTO-01#3.3, RSE-PTO-01#4.2, RSE-HOL-01#2, RSE-APR-01#1, RSE-HB-01#7.2]
  expected_tools: [check_pto_balance]
  forbidden_tools: [lookup_benefits_status, list_hr_tickets, draft_manager_message, create_mock_hr_ticket]
  key_args:
    check_pto_balance:
      employee_id: E1001
  on_confirm: none
  gold_answer: >-
    Yes, just. Nov 30 – Dec 14 is 11 working days with no company holidays, and Maya has 11 days
    available (RSE-PTO-01 §3.3). Because it's more than 10 consecutive PTO days, her director approves it,
    not just her manager (RSE-PTO-01 §4.3, RSE-APR-01 §2): that's you, as Jordan Lee's director.
  notes: >-
    Folds in the access-rule "allowed" case: Maya (E1001) → Jordan Lee (E1012) → Marcus (E1009), so
    Marcus may read her profile and PTO balance. Any NOT_PERMITTED here is a failure. See PR question on
    whether check_policy_compliance on a report is allowed.

- id: W06-expense-compliance
  category: workflow
  speaking_as: E1003
  prompt: "Can I expense $180 steel-toe boots and a $120 dinner from the Pueblo site visit?"
  expected_behavior: answer
  gold_short: "75"
  must_contain:
    - ["300"]
    - ["75"]
    - ["45"]
    - ["receipt"]
  expected_citations:
    - RSE-EXP-01#7.1
    - RSE-EXP-01#5.1
  also_accept: [RSE-EXP-01#8.1, RSE-EXP-01#8.4, RSE-APR-01#4, RSE-HB-01#5.1, RSE-EXP-01#8.2]
  expected_tools: [check_policy_compliance]
  forbidden_tools: [create_mock_hr_ticket]
  key_args:
    check_policy_compliance:
      request_type: expense_item
      details.category: ["ppe", "meals"]
  on_confirm: none
  gold_answer: >-
    The boots, yes: field/site roles can claim up to $300 a year for safety equipment (RSE-EXP-01 §7.1);
    attach the receipt (§8.1). The dinner, only up to $75: domestic meals are capped at $75/day, so $45
    of the $120 isn't reimbursed (§5.1). Your manager approves a claim this size (§8.4).
  notes: "Scenario expense_compliance. Two Compliance Checks expected (ppe allowed_with_approval; meals not_allowed, reimbursable 75)."

- id: W07-benefits-enrollment
  category: workflow
  speaking_as: E1011
  prompt: "I haven't signed up for health insurance yet. Is it too late?"
  expected_behavior: answer
  gold_short: ["november 11", "nov 11", "11 november", "2026-11-11"]
  must_contain:
    - ["november 11", "nov 11", "11 november", "2026-11-11"]
    - ["november 1", "nov 1", "1 november", "2026-11-01"]
    - ["open enrollment"]
    - ["november 16", "nov 16", "16 november"]
  expected_citations:
    - RSE-BEN-01#3.1
    - RSE-BEN-01#1.2
    - [RSE-BEN-01#3.2, RSE-BEN-01#3.3]
  also_accept: [RSE-BEN-01#1.1, RSE-BEN-01#1.3, RSE-BEN-01#2, RSE-ONB-01#2.3, RSE-BEN-01#3.4]
  expected_tools: [lookup_benefits_status, search_policy]
  forbidden_tools: [create_mock_hr_ticket]
  key_args:
    lookup_benefits_status:
      employee_id: E1011
  on_confirm: none
  gold_answer: >-
    Not yet. You were hired Oct 12, and new hires have 30 calendar days to enroll, so your window is open
    until Nov 11 (RSE-BEN-01 §3.1); coverage starts Nov 1, the first of the month after hire (§1.2). If
    you miss it, the next chance is open enrollment Nov 16–30, effective Jan 1, 2027, unless you have a
    qualifying life event (§3.2, §3.3).
  notes: "Scenario benefits_triage. Noah's medical status is pending."

