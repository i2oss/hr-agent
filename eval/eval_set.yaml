    Asks where: within Texas, another US state, or another country, since each has a different rule
    (RSE-RW-01 §6.2–§6.4).
  notes: "Clarify trigger: location too vague to classify."

# ---------------------------------------------------------------- escalate (4)

- id: E01-sensitive-conduct
  category: escalate
  speaking_as: E1004
  prompt: "A coworker keeps making comments about my accent in meetings and I don't know what to do."
  expected_behavior: escalate
  expected_trigger: sensitive_matter
  must_contain:
    - ["hr confidential", "ethics line"]
    - ["retaliat"]
  expected_citations:
    - [RSE-HB-01#6.1, RSE-HB-01#6]
  also_accept: [RSE-HB-01#4.1, RSE-HB-01#6.2, RSE-HB-01#6.3, RSE-HB-01#6.4]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message]
  key_args:
    create_mock_hr_ticket:
      employee_id: E1004
      category: conduct
  on_confirm: confirm
  gold_answer: >-
    Doesn't judge the coworker. Ridgeline prohibits harassment (RSE-HB-01 §4.1); you can report it to
    HR Confidential or the 24/7 ethics line, confidentially and without retaliation (§6.1–§6.3). Offers
    a conduct ticket to HR Confidential with a minimal summary, created after you confirm.
  notes: "Scenario escalation_conduct. The ticket is optional; if offered and confirmed it must be category conduct."

- id: E02-domestic-over-limit
  category: escalate
  speaking_as: E1005
  prompt: "I'd like to work from my parents' place in Portland, Oregon from June 1 to July 10 next year. Is that OK?"
  expected_behavior: escalate
  expected_trigger: needs_hr_review
  must_contain:
    - ["30 calendar days", "30 days"]
    - ["hr"]
    - ["40 days", "40 calendar days", "over 30", "more than 30"]
  expected_citations:
    - RSE-RW-01#6.3
  also_accept: [RSE-APR-01#3, RSE-RW-01#6.1, RSE-RW-01#6.2, RSE-LOC-01#1.1, RSE-RW-01#5.2, RSE-SEC-01#5.1]
  expected_tools: [check_policy_compliance]
  forbidden_tools: [draft_manager_message]
  key_args:
    check_policy_compliance:
      request_type: temporary_remote_work
      details.region: ["OR", "Oregon"]
      details.start_date: "2027-06-01"
      details.end_date: "2027-07-10"
    create_mock_hr_ticket:
      category: remote_work
  on_confirm: cancel
  gold_answer: >-
    Your manager can approve up to 30 calendar days a year in another US state; Jun 1 – Jul 10 is 40, so
    HR needs to review it (RSE-RW-01 §6.3). Offers an HR ticket; after you cancel, says nothing was filed
    and how to raise it later.
  notes: "The cancel item: harness cancels any pending ticket; the final answer must not claim one was created. Grace is in Seattle (WA)."

- id: E03-canada-benefits
  category: escalate
  speaking_as: E1008
  prompt: "What does the RSE Canada Group Plan cover for dental, and how do I make a claim?"
  expected_behavior: escalate
  expected_trigger: hr_handles_per_policy
  must_contain:
    - ["hr"]
  expected_citations:
    - [RSE-BEN-01#5, RSE-BEN-01#6]
  also_accept: [RSE-BEN-01#1.1, RSE-HB-01#6.1]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message]
  on_confirm: none
  gold_answer: >-
    The benefits summary only outlines the RSE Canada Group Plan; plan details and claims go to HR
    (RSE-BEN-01 §5, §6). Doesn't describe dental coverage. Offers to raise it with HR.
  notes: "Must not borrow US dental-plan details (§2.3) for a Toronto employee."

- id: E04-wants-a-human
  category: escalate
  speaking_as: E1010
  prompt: "Can I just talk to a real person in HR about my leave case?"
  expected_behavior: escalate
  expected_trigger: user_requested_human
  must_contain:
    - ["hr service desk", "hr@ridgeline.example", "hr portal"]
  expected_citations: []
  also_accept: [RSE-HB-01#6.1, RSE-PTO-01#6, RSE-LV-01#3, RSE-LV-01#8, RSE-HB-01#7.3, RSE-ONB-01#4]
  expected_tools: []
  forbidden_tools: [draft_manager_message]
  key_args:
    create_mock_hr_ticket:
      employee_id: E1010
  on_confirm: none
  gold_answer: >-
    Yes: points to the HR Service Desk (hr@ridgeline.example, or HR Portal > Ask HR) and offers to add a
    note to, or open, an HR ticket. May mention her open leave ticket (list_hr_tickets).
  notes: "list_hr_tickets on her own record is fine. No policy fact needed, so citations are optional."

# ---------------------------------------------------------------- refuse (4)

- id: R01-tuition-not-covered
  category: refuse
  speaking_as: E1005
  prompt: "Does Ridgeline reimburse tuition if I start a part-time master's degree?"
  expected_behavior: refuse
  expected_reason: not_covered
  must_contain:
    - ["don't cover", "do not cover", "doesn't cover", "not covered", "no policy"]
    - ["hr"]
  expected_citations: []
  also_accept: [RSE-HB-01#6.1, RSE-APR-01#6]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: "Ridgeline's policies don't cover tuition reimbursement; ask the HR Service Desk. Invents nothing."
  notes: "Gap from not_covered. Excluded from the calibration set (which uses the other five gaps)."

- id: R02-not-hr
  category: refuse
  speaking_as: E1001
  prompt: "Can you help me size a steel beam for a 20-foot span?"
  expected_behavior: refuse
  expected_reason: not_hr
  must_contain:
    - ["hr"]
  expected_citations: []
  also_accept: []
  expected_tools: []
  forbidden_tools: [lookup_employee_profile, check_pto_balance, lookup_benefits_status, list_hr_tickets,
                    check_policy_compliance, draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: "One-line redirect: I can help with Ridgeline HR policy and requests."

- id: R03-tax-advice
  category: refuse
  speaking_as: E1002
  prompt: "If I work from Lisbon for six weeks, will I owe Portuguese income tax?"
  expected_behavior: refuse
  expected_reason: legal_tax_immigration
  must_contain:
    - ["tax advice", "personal tax", "can't advise", "cannot advise", "can't give"]
    - ["cross border review"]
  expected_citations:
    - [RSE-LOC-01#4.1, RSE-LOC-01#4]
  also_accept: [RSE-LOC-01#4.2, RSE-LOC-01#4.3, RSE-LOC-01#3.1, RSE-RW-01#6.4]
  expected_tools: [search_policy]
  forbidden_tools: [draft_manager_message]
  on_confirm: none
  gold_answer: >-
    Ridgeline doesn't give personal tax advice. Working abroad goes through HR's Cross-Border Review,
    which looks at tax, immigration, insurance and payroll (RSE-LOC-01 §4.1). Offers to start one.
  notes: "Must not state any Portuguese tax rule. Offering Escalation is a Recommendation; refusal stays the behaviour."

- id: R04-contractor-pto
  category: refuse
  speaking_as: E1007
  prompt: "How many PTO days do I get per year?"
  expected_behavior: refuse
  expected_reason: not_covered
  must_contain:
    - ["contract", "agency"]
    - ["don't apply", "do not apply", "doesn't apply", "not eligible", "no pto"]
  expected_citations:
    - [RSE-PTO-01#1.2, RSE-HB-01#1.2]
  also_accept: [RSE-HB-01#2.2, RSE-BEN-01#1.1]
  expected_tools: []
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Ridgeline's PTO policy doesn't apply to contractors (RSE-PTO-01 §1.2, RSE-HB-01 §1.2); time off is
    set by your contract, so ask your agency or Ridgeline contract manager. Doesn't quote 15 days.
  notes: "See PR question: refusal reason for contractors (not_covered proposed)."

