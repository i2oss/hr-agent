- id: C02-vague-dates-field
  category: clarify
  speaking_as: E1003
  prompt: "Can I take a week off in December?"
  expected_behavior: clarify
  must_contain:
    - ["which dates", "what dates", "which week", "when in december", "dates"]
  expected_citations: []
  also_accept: [RSE-PTO-01#4.4, RSE-PTO-01#4.2]
  expected_tools: []
  forbidden_tools: [draft_manager_message, create_mock_hr_ticket]
  on_confirm: none
  gold_answer: >-
    Asks which week, because the answer depends on it: as a field/site employee, Dec 18–31 needs a
    director's exception (RSE-PTO-01 §4.4), earlier weeks don't. Mentioning the blackout in the question is good.
  notes: >-
    Chosen so the dates change the outcome. For Maya the same question would NOT warrant a Clarification
    (any December week passes), which is why the Persona is Luis.

- id: C03-vague-location
  category: clarify
  speaking_as: E1002
  prompt: "Can I work remotely from somewhere else for a few weeks this spring?"
  expected_behavior: clarify
  must_contain:
    - ["where", "which country", "which state", "location"]
  expected_citations: []
  also_accept: [RSE-RW-01#6.2, RSE-RW-01#6.3, RSE-RW-01#6.4, RSE-RW-01#6.1]
